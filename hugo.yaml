baseURL: https://xg-lain.pages.dev/
languageCode: zh-cn
title: 小鬼的网络安全博客
theme: xg
defaultContentLanguage: zh-cn
uglyURLs: true


languages:
  zh-CN:
    label: 简体中文
    title: 小鬼的网络安全博客
    weight: 1
    hasCJKLanguage: true
  
  en:
    label: English
    title: Little Ghost's Cybersecurity Blog # 英文站标题
    weight: 2
    hasCJKLanguage: true
  
  ja:
    label: 日本語
    title: 小鬼のサイバーセキュリティブログ # 日文站标题
    weight: 3
    hasCJKLanguage: true

# === Markdown 与 数学公式配置 ===
markup:
  # 代码高亮
  highlight:
    guessSyntax: true
    noClasses: false
  
  # Goldmark 解析器（支持 LaTeX 数学公式）
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
          - ["\\[", "\\]"]
          - ["$$", "$$"]
          inline:
          - ["\\(", "\\)"]
          - ["$", "$"]
  
  # 目录样式
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 1

# === 输出配置 (Algolia 搜索 + RSS) ===
outputs:
  home:
    - Algolia
    - HTML
    - RSS

outputFormats:
  Algolia:
    baseName: algolia
    isPlainText: true
    mediaType: application/json
    notAlternative: true
